# Builds the Windows installer and publishes it as a GitHub release - run by
# hand from the Actions tab ("Release" -> "Run workflow") after setting the
# version in crates/app/Cargo.toml. The release is tagged v<that version>;
# the run refuses a -dev version and an existing release.
#
# Uploads the installer, the portable exe (the same Launchpad.exe without
# an installer; it keeps its data in %APPDATA%\launchpad like an installed
# copy, and its updater opens the release page) and launchpad-update.yml
# (electron-builder's
# latest.yml format), which is what the in-app updater reads. Not called
# latest.yml on purpose: 1.2.2's electron-updater must not offer 1.3
# (RUST_PORT_PLAN.md §4.4).
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create as a draft (review it before publishing; the in-app updater ignores drafts)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)
          case "$version" in
            ""|*-dev*) echo "::error::Set a release version in crates/app/Cargo.toml (now: '$version')."; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Make sure this version isn't already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.version }} already exists - bump the version first."
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p launchpad

      # Not on every windows-latest image.
      - name: Install NSIS
        run: |
          if ! command -v makensis > /dev/null && [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - name: Build installer
        id: files
        run: |
          version="${{ steps.version.outputs.version }}"
          installer="dist/Launchpad-Setup-${version}.exe"
          mkdir -p dist
          makensis=$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")
          root=$(cygpath -w "$PWD")
          "$makensis" -V2 "-DVERSION=${version}" "-DEXE=${root}\\target\\release\\launchpad.exe" "-DOUT=${root}\\dist\\Launchpad-Setup-${version}.exe" installer/launchpad.nsi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          portable="dist/Launchpad-${version}-portable.exe"
          cp target/release/launchpad.exe "$portable"
          echo "portable=$portable" >> "$GITHUB_OUTPUT"

      - name: Size gate
        run: bash installer/size-gate.sh target/release/launchpad.exe "${{ steps.files.outputs.installer }}"

      - name: Write launchpad-update.yml
        run: |
          installer="${{ steps.files.outputs.installer }}"
          name=$(basename "$installer")
          sha=$(openssl dgst -sha512 -binary "$installer" | base64 -w0)
          size=$(stat -c %s "$installer")
          {
            echo "version: ${{ steps.version.outputs.version }}"
            echo "files:"
            echo "  - url: ${name}"
            echo "    sha512: ${sha}"
            echo "    size: ${size}"
            echo "path: ${name}"
            echo "sha512: ${sha}"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
          } > dist/launchpad-update.yml
          cat dist/launchpad-update.yml

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          draft_flag=""
          if [ "${{ inputs.draft }}" = "true" ]; then draft_flag="--draft"; fi
          gh release create "v${version}" \
            "${{ steps.files.outputs.installer }}" \
            "${{ steps.files.outputs.portable }}" \
            dist/launchpad-update.yml \
            --target "${{ github.sha }}" \
            --title "Launchpad ${version}" \
            --generate-notes \
            $draft_flag
