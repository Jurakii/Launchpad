[package]
name = "spike-shell-windows"
version = "0.0.0"
edition = "2021"

[features]
# Comparison renderer only: cargo build --release -p spike-shell-windows --features gl
gl = ["slint/renderer-femtovg"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
