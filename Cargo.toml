# Launchpad 1.3 (Rust). See RUST_PORT_PLAN.md. The Electron app at the repo
# root stays runnable until Phase 7; spikes/rust is its own workspace.
[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
exclude = ["spikes"]

# Phase 6: "z" over Phase 0's "s" takes the exe from 14.09 to 12.48 MiB with no
# measurable cost in drawing (same CPU for the same Media scrolling).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
