<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
<title>Launchpad organizer panel</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="bar" class="bar">
    <div class="left">
      <div id="breadcrumb" class="breadcrumb launchpad-only"></div>
      <div id="layouts" class="layouts"></div>
    </div>
    <div class="focused">
      <img id="focusedIcon" class="focused-icon hidden" alt="" />
      <span id="focusedTitle" class="focused-title"></span>
    </div>
    <div class="right">
      <div class="launchpad-buttons launchpad-only">
        <button type="button" id="mediaModeBtn" class="text-btn" title="Media Mode: your games and videos, full screen">Media Mode</button>
        <button type="button" id="layoutsBtn" class="text-btn" title="Window layouts for snapping windows">Layouts</button>
        <button type="button" id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings"></button>
        <button type="button" id="newIslandBtn" class="text-btn">+ New Island</button>
        <button type="button" id="addAppBtn" class="text-btn primary">+ Add App</button>
        <button type="button" id="fullscreenBtn" class="icon-btn"></button>
      </div>
      <button type="button" id="gridBtn" class="icon-btn" title="Grid placer" aria-label="Grid placer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button type="button" id="scenesBtn" class="icon-btn" title="Scenes: save or restore where your windows are" aria-label="Scenes">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="5" width="12" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 3h8M6 1.2h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <div id="clock" class="clock"></div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
